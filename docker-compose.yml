version: '3.8'

services:
  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-cpp-ce:latest
    container_name: artifactory
    restart: unless-stopped
    ports:
      - "8091:8081"
      - "8092:8082"
    volumes:
      - artifactory_data:/var/opt/jfrog/artifactory
    environment:
      - JF_SHARED_DATABASE_TYPE=postgresql
      - JF_SHARED_DATABASE_USERNAME=${DB_USER:-artifactory}
      - JF_SHARED_DATABASE_PASSWORD=${DB_PASSWORD:-password}
      - JF_SHARED_DATABASE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-artifactory}
      - JF_SHARED_DATABASE_DRIVER=org.postgresql.Driver
      - EXTRA_JAVA_OPTIONS=-Xms512m -Xmx2g
    ulimits:
      nproc: 65535
      nofile:
        soft: 32000
        hard: 40000
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 2g
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/router/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  postgres:
    image: postgres:14-alpine
    container_name: artifactory_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-artifactory}
      - POSTGRES_USER=${DB_USER:-artifactory}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-artifactory}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  artifactory_data:
    driver: local
  postgres_data:
    driver: local
